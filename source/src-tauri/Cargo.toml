[package]
name = "diskpulse-pro"
version = "1.0.0"
description = "DiskPulse Pro - disk space analyzer and storage cleanup utility"
authors = ["DiskPulse"]
edition = "2021"
rust-version = "1.80"
license = "MIT"

# The scanning engine lives in `core/` so it can be tested without a GUI toolchain.
[workspace]
members = ["core"]

[lib]
name = "diskpulse_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
diskpulse-core = { path = "core" }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
panic = "abort"
