[package]
name = "diskpulse-core"
version = "1.0.0"
edition = "2021"
rust-version = "1.80"
description = "Filesystem scanning, analysis, duplicate detection and export engine for DiskPulse Pro"
license = "MIT"

[dependencies]
rayon = "1.10"
blake3 = "1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"
thiserror = "2"
sysinfo = { version = "0.33", default-features = false, features = ["disk", "system"] }
trash = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
